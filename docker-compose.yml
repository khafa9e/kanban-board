services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE_PREFIX:-local}/kanban:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/kanban}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      PORT: 5000
    ports:
      - "${WEB_PORT:-8080}:5000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
